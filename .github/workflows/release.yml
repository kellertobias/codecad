name: Release npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Only trusted code from this repository's default branch can mint npm OIDC credentials.
    if: github.repository == 'kellertobias/codecad' && github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:check
      - name: Release, tag, and publish through npm OIDC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
