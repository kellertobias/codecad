<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CodeCAD</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="project-tabs.css" />
  </head>
  <body>
    <header id="titlebar">
      <strong>⌘ CodeCAD</strong><span>DESKTOP STUDIO</span>
      <div id="project-tabs" hidden></div>
      <div class="controls">
        <button data-window="minimize" aria-label="Minimize">−</button
        ><button data-window="maximize" aria-label="Maximize or restore">
          □</button
        ><button data-window="close" aria-label="Close">×</button>
      </div>
    </header>
    <main>
      <img
        class="app-icon"
        src="icon.png"
        alt="CodeCAD"
        width="96"
        height="96"
      />
      <h1>Build with code.<br />Make it real.</h1>
      <p>Parametric parts, woodworking, sheet metal and room plans.</p>
      <div class="start-actions">
        <button id="open-disk" class="primary">Open from disk…</button>
      </div>
      <p class="muted">
        Choose a TypeScript project entry (.ts). Only open code you trust.
      </p>
      <section id="recent-projects" hidden>
        <h2>Recent projects</h2>
        <div class="examples" id="recent-list"></div>
      </section>
      <h2>Explore an example</h2>
      <div class="examples" id="example-list"></div>
      <p id="message" role="status"></p>
    </main>
    <script type="module" src="desktop.js"></script>
  </body>
</html>
