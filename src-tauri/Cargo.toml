[package]
name = "codecad-desktop"
version = "0.8.0"
edition = "2021"
description = "CodeCAD Desktop"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
