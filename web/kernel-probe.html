<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kernel probe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 12px;
        margin: 0;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      dt {
        opacity: 0.7;
      }
      dd {
        margin: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kernel probe: OpenCascade in a browser worker</h1>
      <dl id="results">
        <dt>Status</dt>
        <dd id="status">Loading kernel…</dd>
      </dl>
    </header>
    <canvas id="view"></canvas>
    <script type="module" src="/kernel-probe.js"></script>
  </body>
</html>
